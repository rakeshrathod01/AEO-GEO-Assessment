# Cloud-ready compose for the full stack. Local-first dev can skip this and run
# SQLite + uvicorn directly (see README). Postgres/Redis here for production-like runs.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eclerx
      POSTGRES_PASSWORD: eclerx
      POSTGRES_DB: eclerx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://eclerx:eclerx@postgres:5432/eclerx
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://eclerx:eclerx@postgres:5432/eclerx
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
