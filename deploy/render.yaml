# Render Blueprint — one-click deploy: API + Celery worker + Redis + Postgres.
# Render dashboard -> New -> Blueprint -> point at this repo (deploy/render.yaml).
services:
  - type: web
    name: eclerx-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_REQUIRED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: eclerx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: eclerx-redis
          type: redis
          property: connectionString

  - type: worker
    name: eclerx-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: SECRET_KEY
        fromService:
          name: eclerx-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: eclerx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: eclerx-redis
          type: redis
          property: connectionString

  - type: redis
    name: eclerx-redis
    ipAllowList: []
    plan: free

databases:
  - name: eclerx-db
    plan: free
